<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="250">
  <defs>
    <!-- Background Gradient Matching the Reference -->
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#D9808E" />
      <stop offset="35%" stop-color="#DC8F8F" />
      <stop offset="70%" stop-color="#D49B88" />
      <stop offset="100%" stop-color="#C89B84" />
    </linearGradient>

    <!-- Monitor Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191D26" />
      <stop offset="100%" stop-color="#12151C" />
    </linearGradient>

    <!-- Drop Shadow for Text -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.22" />
    </filter>
    
    <!-- Glow filter for sparkles and neural lines -->
    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="250" rx="14" fill="url(#bannerGrad)" />

  <!-- Background Pixel Specks / Atmosphere -->
  <g opacity="0.2" fill="#FFFFFF">
    <rect x="50" y="25" width="6" height="6" />
    <rect x="120" y="18" width="6" height="6" />
    <rect x="360" y="45" width="6" height="6" />
    <rect x="390" y="85" width="7" height="7" />
    <rect x="410" y="25" width="6" height="6" />
    <rect x="830" y="45" width="7" height="7" />
    <rect x="850" y="195" width="6" height="6" />
  </g>

  <!-- Left: Cozy Tech Workstation (Monitor + Keyboard + Mouse) -->
  <g transform="translate(45, 18)">

    <!-- COMPUTER MONITOR (Clear, distinct workstation screen) -->
    <!-- Monitor Stand -->
    <rect x="156" y="112" width="22" height="22" rx="2" fill="#A88167" />
    <rect x="142" y="130" width="50" height="7" rx="3" fill="#8E6348" />

    <!-- Monitor Outer Chassis -->
    <rect x="75" y="12" width="184" height="106" rx="8" fill="#8E6348" />
    <rect x="77" y="14" width="180" height="102" rx="6" fill="#D5AC8E" />

    <!-- Screen Bezel & Display -->
    <rect x="83" y="20" width="168" height="90" rx="4" fill="url(#screenGrad)" />

    <!-- Terminal Window Bar -->
    <rect x="83" y="20" width="168" height="15" rx="3" fill="#232733" />
    <circle cx="93" cy="27" r="3.2" fill="#F8969E" />
    <circle cx="103" cy="27" r="3.2" fill="#FFD3B6" />
    <circle cx="113" cy="27" r="3.2" fill="#A8D8B9" />

    <!-- Screen Content: Simple & Clean Hello World Terminal -->
    <g transform="translate(95, 54)">
      <!-- Command input line -->
      <text x="0" y="0" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="600" fill="#F8969E">&gt; print(&quot;hello world&quot;)</text>

      <!-- Output Line -->
      <text x="0" y="22" font-family="'Fira Code', 'Courier New', monospace" font-size="13" font-weight="700" fill="#FFF1E5">hello world ✨</text>

      <!-- Prompt Line with Cursor -->
      <g transform="translate(0, 39)">
        <text x="0" y="0" font-family="'Fira Code', 'Courier New', monospace" font-size="10" font-weight="500" fill="#FFD3B6">&gt; ready_</text>
        <rect x="52" y="-9" width="6" height="11" rx="1" fill="#F8969E" opacity="0.8" />
      </g>
    </g>

    <!-- Floating Sparkles around Monitor -->
    <g fill="#FFFAF4" filter="url(#sparkleGlow)">
      <rect x="270" y="30" width="8" height="8" />
      <rect x="285" y="65" width="6" height="6" />
      <rect x="58" y="40" width="6" height="6" />
      <rect x="260" y="95" width="7" height="7" />
    </g>

    <!-- MOUSE (Left of Keyboard) -->
    <g transform="translate(5, 126)">
      <!-- Mouse Body -->
      <rect x="12" y="18" width="24" height="42" rx="10" fill="#D98897" />
      <rect x="15" y="21" width="8" height="18" rx="4" fill="#EFA3AF" />
      <rect x="25" y="21" width="8" height="18" rx="4" fill="#EFA3AF" />
      <rect x="15" y="42" width="18" height="14" rx="5" fill="#EFA3AF" />
      <!-- Scroll Wheel -->
      <rect x="22" y="24" width="4" height="9" rx="2" fill="#6D3A44" />
      <!-- Mouse Cord Connecting to Keyboard Chassis -->
      <path d="M24,18 C24,5 45,5 45,15 C45,25 70,25 70,35 L70,45" fill="none" stroke="#D98897" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- MECHANICAL KEYBOARD -->
    <g transform="translate(75, 134)">
      <!-- Case Outline & Bevel -->
      <rect x="0" y="0" width="185" height="72" rx="8" fill="#8E6348" />
      <rect x="2" y="2" width="181" height="68" rx="6" fill="#D5AC8E" />
      <rect x="6" y="6" width="173" height="60" rx="4" fill="#EED1B9" />

      <!-- Keycaps (Pixel Grid Matrix) -->
      <g fill="#FFF1E5">
        <!-- Row 1 -->
        <rect x="10" y="10" width="12" height="9" rx="1" />
        <rect x="26" y="10" width="12" height="9" rx="1" />
        <rect x="42" y="10" width="12" height="9" rx="1" />
        <rect x="58" y="10" width="12" height="9" rx="1" />
        <rect x="74" y="10" width="12" height="9" rx="1" />
        <rect x="90" y="10" width="12" height="9" rx="1" />
        <rect x="106" y="10" width="12" height="9" rx="1" />
        <rect x="122" y="10" width="12" height="9" rx="1" />
        <rect x="138" y="10" width="12" height="9" rx="1" />
        <rect x="154" y="10" width="20" height="9" rx="1" />

        <!-- Row 2 -->
        <rect x="10" y="22" width="17" height="9" rx="1" />
        <rect x="31" y="22" width="12" height="9" rx="1" />
        <rect x="47" y="22" width="12" height="9" rx="1" />
        <rect x="63" y="22" width="12" height="9" rx="1" />
        <rect x="79" y="22" width="12" height="9" rx="1" />
        <rect x="95" y="22" width="12" height="9" rx="1" />
        <rect x="111" y="22" width="12" height="9" rx="1" />
        <rect x="127" y="22" width="12" height="9" rx="1" />
        <rect x="143" y="22" width="12" height="9" rx="1" />
        <rect x="159" y="22" width="15" height="9" rx="1" />

        <!-- Row 3 -->
        <rect x="10" y="34" width="21" height="9" rx="1" />
        <rect x="35" y="34" width="12" height="9" rx="1" />
        <rect x="51" y="34" width="12" height="9" rx="1" />
        <rect x="67" y="34" width="12" height="9" rx="1" />
        <rect x="83" y="34" width="12" height="9" rx="1" />
        <rect x="99" y="34" width="12" height="9" rx="1" />
        <rect x="115" y="34" width="12" height="9" rx="1" />
        <rect x="131" y="34" width="12" height="9" rx="1" />
        <rect x="147" y="34" width="27" height="9" rx="1" />

        <!-- Row 4 (Spacebar Row) -->
        <rect x="10" y="46" width="22" height="9" rx="1" />
        <rect x="36" y="46" width="16" height="9" rx="1" />
        <rect x="56" y="46" width="76" height="9" rx="1" fill="#FEE9D7" />
        <rect x="136" y="46" width="18" height="9" rx="1" />
        <rect x="158" y="46" width="16" height="9" rx="1" />
      </g>
    </g>
  </g>

  <!-- Right: Header Typography & Non-Overlapping Stars -->
  <g transform="translate(420, 142)">
    <!-- Name Text -->
    <text x="0" y="0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Outfit', 'Roboto', sans-serif" font-size="48" font-weight="800" fill="#FFFFFF" filter="url(#textShadow)" letter-spacing="0.5">
      Hi, I'm Siddhi
    </text>
    
    <!-- Golden Sparkle Stars: Placed at x=375 with generous margin (zero overlap!) -->
    <g transform="translate(375, -16)">
      <!-- Large 4-point Sparkle Star -->
      <path d="M 0,-24 L 6,-6 L 24,0 L 6,6 L 0,24 L -6,6 L -24,0 L -6,-6 Z" fill="#FFE0A3" filter="url(#sparkleGlow)" />
      <!-- Small Sparkle Star (top right) -->
      <path d="M 24,-20 L 27,-12 L 35,-9 L 27,-6 L 24,2 L 21,-6 L 13,-9 L 21,-12 Z" fill="#FFF4D9" />
    </g>
  </g>
</svg>
